name: mobiliti
description: "App de mobilité verte - Covoiturage écologique Yopougon, Abidjan"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # State Management
  provider: ^6.1.5+1

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0
  geocoding: ^5.0.0

  # Firebase
  firebase_core: ^3.15.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.3.0

  # Utils
  http: ^1.1.0
  uuid: ^4.0.0
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
